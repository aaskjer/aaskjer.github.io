<!DOCTYPE html>

<!-- bsg-overlay-version: 6 -->

<html lang='en'>

<head>

<meta charset='UTF-8' />

<title>Battleship Overlay</title>

<style>

  :root{

    --scale: 1;

    --font-scale: 1;

    --cells: 8;

    --hit: #ff5a3c;

    --miss: #8fb8d8;

    --sunk: #d3283a;

    --ship: #5b6b7c;

    --grid: #4a7fa5;

    --water: #0d2438;

    --stage-bg: transparent;

    --gold: #ffce54;

    /* The centre column has to keep enough room for a result badge, and the boards would otherwise

       eat all of it: two 12x12 boards at the comfortable cell size leave it under 11vw, which is

       narrower than the word ABANDONED. So the cell is the smaller of the comfortable size and the

       size that still leaves --centre-w for the middle. Only the largest boards are affected. */

    --centre-w: 15vw;

    --cell-max: calc(3.1vw * var(--scale));

    --cell-fit: calc((100vw - 7.2vw - var(--centre-w)) / (2 * (var(--cells) + 0.62)) - (0.16vw * var(--scale)));

    --cell: min(var(--cell-max), var(--cell-fit));

    --gap: calc(0.16vw * var(--scale));

  }



  html, body {

    margin: 0; padding: 0;

    width: 100%; height: 100%;

    background: transparent;

    overflow: hidden;

    font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif;

    color: #fff;

  }



  #stage {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: calc(1.6vw * var(--scale));

    box-sizing: border-box;

    padding: 2vh 2vw;

    background: var(--stage-bg);

    opacity: 0;

    transition: opacity .35s ease;

  }

  #stage.visible { opacity: 1; }



  /* ---------- panels ---------- */



  .panel { display: flex; flex-direction: column; align-items: center; gap: calc(.55vh * var(--scale)); }



  .panel-title {

    display: flex; align-items: baseline; gap: .5em;

    font-size: calc(1.05vw * var(--font-scale) * var(--scale));

    font-weight: 700;

    letter-spacing: .08em;

    text-transform: uppercase;

    text-shadow: 0 2px 6px rgba(0,0,0,.9);

    max-width: calc(var(--cells) * (var(--cell) + var(--gap)) + 2.2vw);

    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

  }

  .panel-title .remaining {

    font-size: .82em; font-weight: 400; opacity: .8; letter-spacing: .02em; text-transform: none;

  }

  .panel.enemy .panel-title { color: #ffbfae; }

  .panel.own   .panel-title { color: #b9dcff; }



  /* ---------- grid ---------- */



  .board { display: grid; gap: var(--gap); }

  .board.with-coords {

    grid-template-columns: calc(var(--cell) * .62) repeat(var(--cells), var(--cell));

    grid-template-rows: calc(var(--cell) * .62) repeat(var(--cells), var(--cell));

  }

  .board.no-coords {

    grid-template-columns: repeat(var(--cells), var(--cell));

    grid-template-rows: repeat(var(--cells), var(--cell));

  }



  .label {

    display: flex; align-items: center; justify-content: center;

    font-size: calc(var(--cell) * .38);

    font-weight: 600;

    opacity: .65;

    text-shadow: 0 1px 3px rgba(0,0,0,.9);

  }



  .cell {

    position: relative;

    background: var(--water);

    border: 1px solid color-mix(in srgb, var(--grid) 45%, transparent);

    box-sizing: border-box;

    border-radius: calc(var(--cell) * .08);

    display: flex; align-items: center; justify-content: center;

  }



  /* undamaged hull on the player's own side */

  .cell.ship {

    background: var(--ship);

    border-color: color-mix(in srgb, var(--ship) 70%, #fff);

    box-shadow: inset 0 0 calc(var(--cell) * .18) rgba(0,0,0,.45);

  }



  .cell.miss::after {

    content: '';

    width: calc(var(--cell) * .22); height: calc(var(--cell) * .22);

    border-radius: 50%;

    background: var(--miss);

    opacity: .85;

  }



  .cell.hit {

    background: color-mix(in srgb, var(--hit) 30%, var(--water));

    border-color: var(--hit);

  }

  .cell.hit::after {

    content: '';

    width: calc(var(--cell) * .52); height: calc(var(--cell) * .52);

    background: var(--hit);

    clip-path: polygon(50% 0%, 62% 34%, 100% 36%, 70% 58%, 82% 96%, 50% 72%, 18% 96%, 30% 58%, 0% 36%, 38% 34%);

  }



  .cell.sunk {

    background: color-mix(in srgb, var(--sunk) 55%, #000);

    border-color: var(--sunk);

  }

  .cell.sunk::after {

    content: '';

    width: calc(var(--cell) * .46); height: calc(var(--cell) * .46);

    background: #fff;

    opacity: .92;

    clip-path: polygon(20% 0%, 50% 30%, 80% 0%, 100% 20%, 70% 50%, 100% 80%, 80% 100%, 50% 70%, 20% 100%, 0% 80%, 30% 50%, 0% 20%);

  }



  /* the shot that just landed */

  .cell.last { z-index: 2; }

  .cell.last::before {

    content: '';

    position: absolute; inset: calc(var(--cell) * -.12);

    border: 2px solid var(--gold);

    border-radius: calc(var(--cell) * .16);

    box-shadow: 0 0 calc(var(--cell) * .3) var(--gold);

  }

  .anim .cell.last::before { animation: ping 1.1s ease-out infinite; }



  @keyframes ping {

    0%   { transform: scale(1);    opacity: 1; }

    70%  { transform: scale(1.22); opacity: 0; }

    100% { transform: scale(1.22); opacity: 0; }

  }

  .anim .cell.hit::after, .anim .cell.sunk::after { animation: pop .35s ease-out; }

  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }



  /* ---------- roster ---------- */



  .roster {

    display: flex; flex-wrap: wrap; justify-content: center;

    gap: calc(.35vw * var(--scale)) calc(.6vw * var(--scale));

    max-width: calc(var(--cells) * (var(--cell) + var(--gap)) + 2.2vw);

    margin-top: calc(.3vh * var(--scale));

  }

  /* One roster hidden while the other shows: the box stays, so both boards keep the same top edge.

     Hidden on both sides the element is left empty and takes up nothing. */

  .roster.ghost { visibility: hidden; }

  .ship-chip {

    display: flex; align-items: center; gap: .38em;

    font-size: calc(.62vw * var(--font-scale) * var(--scale));

    letter-spacing: .02em;

    text-shadow: 0 1px 3px rgba(0,0,0,.9);

    opacity: .95;

  }

  .ship-chip.is-sunk { opacity: .45; text-decoration: line-through; text-decoration-color: var(--sunk); }

  .pips { display: flex; gap: 1px; }

  .pip {

    width: calc(var(--cell) * .17); height: calc(var(--cell) * .17);

    border-radius: 1px;

    background: var(--ship);

    border: 1px solid rgba(255,255,255,.28);

  }

  .pip.dmg { background: var(--hit); border-color: var(--hit); }

  .ship-chip.is-sunk .pip { background: var(--sunk); border-color: var(--sunk); }



  /* ---------- centre column ---------- */



  #centre {

    display: flex; flex-direction: column; align-items: center;

    gap: calc(1vh * var(--scale));

    /* flex-shrink 0: the boards are fixed-size grids and cannot give way, so without this the

       centre is the only thing that shrinks and it collapses under its own content. */

    flex: 0 0 auto;

    width: var(--centre-w);

    min-width: var(--centre-w);

  }



  #phase {

    font-size: calc(.72vw * var(--font-scale) * var(--scale));

    letter-spacing: .16em;

    text-transform: uppercase;

    opacity: .7;

    text-shadow: 0 2px 5px rgba(0,0,0,.9);

  }



  .ring-wrap { position: relative; width: calc(4.6vw * var(--scale)); height: calc(4.6vw * var(--scale)); }

  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .ring-bg { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 7; }

  .ring-fg {

    fill: none; stroke: var(--gold); stroke-width: 7; stroke-linecap: round;

    /* Only the sweep is animated. Transitioning `stroke` as well leaves the warning colours stuck

       part-way, because the dash offset is rewritten every poll and the colour never settles - and

       a countdown turning red is meant to snap, not fade in over a third of a second. */

    transition: stroke-dashoffset .3s linear;

  }

  .ring-wrap.warn  .ring-fg { stroke: #ffa726; }

  .ring-wrap.alert .ring-fg { stroke: var(--sunk); }

  .anim .ring-wrap.alert { animation: pulse .9s ease-in-out infinite; }

  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }



  #ring-text {

    position: absolute; inset: 0;

    display: flex; align-items: center; justify-content: center;

    font-size: calc(1.2vw * var(--font-scale) * var(--scale));

    font-weight: 700;

    text-shadow: 0 2px 5px rgba(0,0,0,.9);

  }



  #score { text-align: center; text-shadow: 0 2px 5px rgba(0,0,0,.9); }

  #score .net { font-size: calc(1.15vw * var(--font-scale) * var(--scale)); font-weight: 700; }

  #score .net.up { color: #7ddf87; }

  #score .net.down { color: #ff8a76; }

  #score .accuracy { font-size: calc(.62vw * var(--font-scale) * var(--scale)); opacity: .75; }



  #badge {

    font-size: calc(1.5vw * var(--font-scale) * var(--scale));

    font-weight: 800;

    letter-spacing: .1em;

    padding: .3em .7em;

    border-radius: .25em;

    border: 2px solid currentColor;

    text-align: center;

    text-shadow: 0 2px 6px rgba(0,0,0,.9);

    box-sizing: border-box;

    max-width: 100%;

  }

  #badge.win  { color: var(--gold);  background: rgba(255,206,84,.14); }

  #badge.loss { color: #ff8a76;      background: rgba(211,40,58,.18); }

  #badge.away { color: #cfd8e3;      background: rgba(255,255,255,.1); }



  .hidden { display: none !important; }

</style>

</head>

<body>



<div id='stage'>

  <div class='panel own'>

    <div class='panel-title'><span id='own-name'></span><span class='remaining' id='own-left'></span></div>

    <div class='board' id='own-board'></div>

    <div class='roster' id='own-roster'></div>

  </div>



  <div id='centre'>

    <div id='phase'></div>

    <div class='ring-wrap' id='ring'>

      <svg viewBox='0 0 100 100'>

        <circle class='ring-bg' cx='50' cy='50' r='44'></circle>

        <circle class='ring-fg' id='ring-fg' cx='50' cy='50' r='44'></circle>

      </svg>

      <div id='ring-text'></div>

    </div>

    <div id='score'>

      <div class='net' id='net'></div>

      <div class='accuracy' id='accuracy'></div>

    </div>

    <div id='badge' class='hidden'></div>

  </div>



  <div class='panel enemy'>

    <div class='panel-title'><span id='foe-name'></span><span class='remaining' id='foe-left'></span></div>

    <div class='board' id='foe-board'></div>

    <div class='roster' id='foe-roster'></div>

  </div>

</div>



<script>

(function () {

  'use strict';



  var STATE_URL = 'battleship_state.json';

  var POLL_MS = 250;

  var GAMEOVER_FADE_MS = 8000;



  var stage = document.getElementById('stage');

  var ring = document.getElementById('ring');

  var ringFg = document.getElementById('ring-fg');

  var ringText = document.getElementById('ring-text');

  var badge = document.getElementById('badge');

  var centre = document.getElementById('centre');



  var RING_LEN = 2 * Math.PI * 44;

  ringFg.style.strokeDasharray = RING_LEN;



  var fadeTimer = null;



  function clearFadeTimer() {

    if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }

  }



  function setVar(name, value) {

    if (value !== undefined && value !== null && value !== '') {

      document.documentElement.style.setProperty(name, value);

    }

  }



  /* Groups digits with the separator configured in the settings window. Deliberately not

     toLocaleString(), which follows whatever locale the OBS browser source happens to run in and

     would disagree with the separator used in chat. */

  function formatNumber(value, separator) {

    var digits = Math.abs(Math.round(value)).toString();

    var out = '';

    for (var i = 0; i < digits.length; i++) {

      if (i > 0 && (digits.length - i) % 3 === 0) out += (separator || '');

      out += digits.charAt(i);

    }

    return out;

  }



  function hexToRgba(hex, alpha) {

    var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');

    if (!m) return 'transparent';

    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + alpha + ')';

  }



  /* Converts 'B7' back into zero-based column/row so the last shot can be highlighted. */

  function parseCoord(text) {

    if (!text || text.length < 2) return null;

    var col = text.charCodeAt(0) - 65;

    var row = parseInt(text.substring(1), 10) - 1;

    if (isNaN(col) || isNaN(row) || col < 0 || row < 0) return null;

    return { col: col, row: row };

  }



  var CLASS_FOR = { 'o': 'miss', 'x': 'hit', 'X': 'sunk', 's': 'ship' };



  function renderBoard(el, side, showCoords, lastShot) {

    el.innerHTML = '';

    if (!side || !side.rows || !side.rows.length) return;



    var n = side.rows.length;

    el.className = 'board ' + (showCoords ? 'with-coords' : 'no-coords');



    if (showCoords) {

      el.appendChild(makeLabel(''));

      for (var c = 0; c < n; c++) el.appendChild(makeLabel(String.fromCharCode(65 + c)));

    }



    var mark = parseCoord(lastShot);



    for (var r = 0; r < n; r++) {

      if (showCoords) el.appendChild(makeLabel(String(r + 1)));



      for (var c2 = 0; c2 < n; c2++) {

        var ch = side.rows[r].charAt(c2);

        var cell = document.createElement('div');

        cell.className = 'cell';

        if (CLASS_FOR[ch]) cell.classList.add(CLASS_FOR[ch]);

        if (mark && mark.col === c2 && mark.row === r) cell.classList.add('last');

        el.appendChild(cell);

      }

    }

  }



  function makeLabel(text) {

    var d = document.createElement('div');

    d.className = 'label';

    d.textContent = text;

    return d;

  }



  function renderRoster(el, side, show, keepSpace) {

    el.innerHTML = '';

    // Both fleets carry the same ships, so a roster that is built and then made invisible is

    // exactly the height needed to hold the other side's board level with this one.

    el.classList.toggle('ghost', !show && keepSpace);

    if ((!show && !keepSpace) || !side || !side.roster) return;



    side.roster.forEach(function (ship) {

      var chip = document.createElement('div');

      chip.className = 'ship-chip' + (ship.sunk ? ' is-sunk' : '');



      var name = document.createElement('span');

      name.textContent = ship.name;

      chip.appendChild(name);



      var pips = document.createElement('div');

      pips.className = 'pips';

      for (var i = 0; i < ship.length; i++) {

        var pip = document.createElement('div');

        pip.className = 'pip' + (i < ship.hits ? ' dmg' : '');

        pips.appendChild(pip);

      }

      chip.appendChild(pips);

      el.appendChild(chip);

    });

  }



  function renderTimer(state) {

    var show = state.showTurnTimer && state.phase !== 'over';

    ring.classList.toggle('hidden', !show);

    if (!show) return;



    var total = state.timeoutMs > 0 ? state.timeoutMs : 1;

    var left = Math.max(0, Math.min(state.expiresInMs, total));

    var fraction = left / total;



    ringFg.style.strokeDashoffset = RING_LEN * (1 - fraction);

    ringText.textContent = Math.ceil(left / 1000);



    // Amber and red mirror the two chat warnings, so the overlay says the same thing chat does.

    // toggle(force) rather than remove-then-add: this runs every poll, and removing a class only to

    // put it straight back restarts the colour transition each time, so it never actually arrives.

    var alert = state.warnSecondMs > 0 && left <= state.warnSecondMs;

    ring.classList.toggle('alert', alert);

    ring.classList.toggle('warn', !alert && state.warnFirstMs > 0 && left <= state.warnFirstMs);

  }



  var BADGES = {

    'win':  { text: 'ENEMY FLEET SUNK', cls: 'win' },

    'loss': { text: 'FLEET LOST',       cls: 'loss' },

    'turntimeout':   { text: 'ABANDONED', cls: 'away' },

    'deploytimeout': { text: 'STOOD DOWN', cls: 'away' }

  };



  /* ABANDONED and STOOD DOWN are single words: CSS has nowhere to wrap them, so on a big board they

     used to run straight out of the centre column and under the enemy grid. Rather than hyphenate a

     word in half, step the size down until it fits - whole words, always inside their box, whatever

     the grid size, the overlay scale and the wording. */

  function fitBadge() {

    badge.style.fontSize = '';

    var room = centre.clientWidth;

    if (!room) return;



    var size = parseFloat(getComputedStyle(badge).fontSize);

    var floor = Math.max(8, size * 0.45);

    while (badge.scrollWidth > room && size > floor) {

      size -= 1;

      badge.style.fontSize = size + 'px';

    }

  }



  function renderBadge(state) {

    var info = state.gameOver ? BADGES[(state.outcome || '').toLowerCase()] : null;

    if (!info) { badge.classList.add('hidden'); return; }



    badge.textContent = info.text;

    badge.className = info.cls;

    badge.classList.remove('hidden');

    fitBadge();

  }



  function render(state) {

    if (!state || !state.active || (state.freeGame && state.hideOnFreeGame)) {

      stage.classList.remove('visible');

      return;

    }



    setVar('--scale', state.scale);

    setVar('--font-scale', state.fontScale);

    setVar('--hit', state.hitColor);

    setVar('--miss', state.missColor);

    setVar('--sunk', state.sunkColor);

    setVar('--ship', state.shipColor);

    setVar('--grid', state.gridColor);

    setVar('--water', state.waterColor);

    setVar('--cells', state.size || 8);

    setVar('--stage-bg', hexToRgba(state.backgroundColor, state.backgroundOpacity || 0));



    stage.classList.toggle('anim', !!state.animationsEnabled);



    var own = state.player || {};

    var foe = state.enemy || {};



    document.getElementById('own-name').textContent = own.name || '';

    document.getElementById('foe-name').textContent = foe.name || '';

    document.getElementById('own-left').textContent = own.shipsRemaining + ' afloat';

    document.getElementById('foe-left').textContent = foe.shipsRemaining + ' afloat';



    renderBoard(document.getElementById('own-board'), own, state.showCoords, state.lastAdmiralShot);

    renderBoard(document.getElementById('foe-board'), foe, state.showCoords, state.lastPlayerShot);

    renderRoster(document.getElementById('own-roster'), own, state.showPlayerRoster, state.showEnemyRoster);

    renderRoster(document.getElementById('foe-roster'), foe, state.showEnemyRoster, state.showPlayerRoster);



    var phaseText = state.phase === 'deploy' ? 'Awaiting orders'

                  : state.phase === 'over' ? 'Battle over'

                  : 'Open fire';

    document.getElementById('phase').textContent = phaseText;



    var scoreEl = document.getElementById('score');

    scoreEl.classList.toggle('hidden', !state.showScore);

    if (state.showScore) {

      var net = document.getElementById('net');

      if (state.freeGame) {

        net.textContent = '';

        net.className = 'net';

      } else {

        var value = state.net || 0;

        var sign = value > 0 ? '+' : value < 0 ? '-' : '';

        net.textContent = sign + formatNumber(value, state.numberSeparator);

        net.className = 'net' + (value > 0 ? ' up' : value < 0 ? ' down' : '');

      }

      var accuracy = state.shots > 0 ? Math.round(100 * state.hits / state.shots) : 0;

      document.getElementById('accuracy').textContent = state.shots + ' shots - ' + accuracy + '%';

    }



    renderTimer(state);

    renderBadge(state);

    stage.classList.add('visible');



    if (state.gameOver) {

      if (!fadeTimer) {

        var fadeMs = state.gameOverFadeMs > 0 ? state.gameOverFadeMs : GAMEOVER_FADE_MS;

        fadeTimer = setTimeout(function () {

          stage.classList.remove('visible');

          fadeTimer = null;

        }, fadeMs);

      }

    } else {

      clearFadeTimer();

    }

  }



  var lastStateText = null;

  var lastState = null;



  function poll() {

    fetch(STATE_URL + '?t=' + Date.now(), { cache: 'no-store' })

      .then(function (r) { return r.ok ? r.text() : null; })

      .then(function (text) {

        if (text === null) return;

        if (text !== lastStateText) {

          lastStateText = text;

          lastState = JSON.parse(text);

          render(lastState);

        } else if (lastState && lastState.active && !lastState.gameOver) {

          // The file only changes when a shot lands, so the clock is run locally in between -

          // otherwise the countdown ring would sit still for the whole turn.

          lastState.expiresInMs = Math.max(0, lastState.expiresInMs - POLL_MS);

          renderTimer(lastState);

        }

      })

      .catch(function () { })

      .then(function () { setTimeout(poll, POLL_MS); });

  }



  window.addEventListener('resize', function () { if (!badge.classList.contains('hidden')) fitBadge(); });



  poll();

})();

</script>

</body>

</html>
