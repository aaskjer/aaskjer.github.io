<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- GameCheck: a price tag with a game controller for the free games and the sales, and a check mark
       for the check that keeps the Discord messages current. Same family as the Chat Calendar logo. -->
  <defs>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a257ed"/>
      <stop offset="1" stop-color="#0b72ff"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1efff"/>
      <stop offset="1" stop-color="#aaa3d8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <g stroke="#0d0b18" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(-12 6) rotate(-28 128 118)">
      <path d="M86 58 H206 a24 24 0 0 1 24 24 V154 a24 24 0 0 1 -24 24 H86 L30 128 a12 12 0 0 1 0 -20 Z"
            fill="url(#tag)" filter="url(#shadow)"/>
      <circle cx="68" cy="118" r="10" fill="#15122b"/>

      <g transform="translate(152 118) scale(.82) translate(-152 -118)">
        <path d="M116 88 h72 a28 28 0 0 1 27 21 l11 38 a16 16 0 0 1 -27 15 l-14 -17 h-57 l-14 17 a16 16 0 0 1 -27 -15 l11 -38 a28 28 0 0 1 27 -21 Z"
              fill="url(#pad)"/>
        <path d="M121 108 v24 M109 120 h24" fill="none" stroke-width="8"/>
        <circle cx="184" cy="112" r="6" fill="#0d0b18" stroke="none"/>
        <circle cx="197" cy="126" r="6" fill="#0d0b18" stroke="none"/>
      </g>
    </g>

    <circle cx="188" cy="192" r="44" fill="url(#badge)" filter="url(#shadow)"/>
    <path d="M167 193 l14 14 l28 -30" fill="none" stroke="#1a1726" stroke-width="11"/>
  </g>
</svg>
