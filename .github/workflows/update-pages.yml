# Keeps the project pages current: their documents, what their import strings add, the latest
# version in their link previews and the About texts from GitHub, plus the commands page, the help
# page, the release feed and the search index, by running _tools/update-pages.js every hour and after
# every change to projects.js, the templates or the script. It commits to main only when something
# changed.
name: Update project pages

on:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths: [assets/js/projects.js, '_tools/*-page.html', _tools/problems.md, _tools/update-pages.js, assets/js/vendor/marked.umd.js]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pages

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node _tools/update-pages.js

      - name: Commit the changes
        run: |
          git add -A -- '*.html' sitemap.xml feed.xml assets/search.json
          if git diff --cached --quiet; then echo 'Nothing changed.'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898213+github-actions[bot]@users.noreply.github.com' commit -q -m 'Update the project pages'
          git push -q
