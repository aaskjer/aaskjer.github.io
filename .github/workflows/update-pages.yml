# Keeps the project pages current: their documents, what their import strings add, the latest
# version in their link previews and the About texts from GitHub, plus the commands page, the help
# page, the release feed, the search index and the fallback numbers in projects.js, by running
# _tools/update-pages.js every hour and after every change to projects.js, the templates or the
# script. It commits to main only when something changed.
name: Update project pages

on:
  schedule:
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths: [assets/js/projects.js, '_tools/*-page.html', _tools/problems.md, _tools/update-pages.js, assets/js/vendor/marked.umd.js]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pages

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # When main moved on while the pages were built (two merges in a row), GitHub refuses the
      # push. The pages are then built again on top of the new main rather than merged into it, so
      # no change to projects.js gets lost; three tries, then the next run takes over.
      - name: Update the pages and commit them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            node _tools/update-pages.js
            git add -A -- '*.html' sitemap.xml feed.xml assets/search.json assets/js/projects.js
            if git diff --cached --quiet; then echo 'Nothing changed.'; exit 0; fi
            git -c user.name='github-actions[bot]' -c user.email='41898213+github-actions[bot]@users.noreply.github.com' commit -q -m 'Update the project pages'
            if git push -q; then exit 0; fi
            echo "main moved on (try $attempt), building the pages again on top of it."
            git fetch -q --depth=1 origin main
            git reset -q --hard FETCH_HEAD
          done
          exit 1
